name: PHP 7.4 CI

on:
  push:
    branches: [main-php7.4]
  pull_request:
    branches: [main-php7.4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: dom, mbstring, pcre, posix, tokenizer, xml, xmlwriter
          tools: composer:v2
          coverage: none

      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit
      - run: composer lint
      - run: composer format-check
      - run: composer refactor-check
      - run: composer test
