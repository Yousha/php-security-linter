<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#203d5d" stroke-width="1.8"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172b45}
    .heading{font-size:31px;font-weight:700}.sub{font-size:17px;fill:#53677d}
    .action{fill:#eaf3ff;stroke:#31577e;stroke-width:2.3}
    .data{fill:#fff7dd;stroke:#8a702c;stroke-width:2.1}
    .decision{fill:#fff;stroke:#31577e;stroke-width:2.4}
    .flow{fill:none;stroke:#203d5d;stroke-width:2.4;marker-end:url(#arrow)}
    .plain{fill:none;stroke:#203d5d;stroke-width:2.4}
    .label{font-size:17px;font-weight:700}.detail{font-size:15px;fill:#53677d}
    .edge{font-size:15px;font-style:italic;fill:#31577e}
    .bar{fill:#203d5d}
  </style>
</defs>
<rect x="12" y="12" width="1576" height="1236" rx="18" fill="#fff" stroke="#203d5d" stroke-width="2"/>
<text x="48" y="58" class="heading">UML Activity Diagram — PHP Security Linter Data Flow</text>
<text x="48" y="88" class="sub">CLI scan lifecycle · PHP 8.0+ · static analysis only (scanned source code is never executed)</text>

<!-- initial -->
<circle cx="800" cy="130" r="13" fill="#172b45"/>
<path d="M800 143 V175" class="flow"/>

<!-- parse -->
<rect x="620" y="178" width="360" height="86" rx="22" class="action"/>
<text x="800" y="211" text-anchor="middle" class="label">Parse CLI options</text>
<text x="800" y="238" text-anchor="middle" class="detail">--path · exclusions · rule IDs · format · output</text>
<path d="M800 264 V300" class="flow"/>

<!-- decision valid -->
<polygon points="800,300 900,360 800,420 700,360" class="decision"/>
<text x="800" y="355" text-anchor="middle" class="label">Input valid?</text>
<path d="M700 360 H490 V440" class="flow"/>
<text x="580" y="344" class="edge">No</text>
<rect x="330" y="442" width="320" height="78" rx="20" class="action"/>
<text x="490" y="473" text-anchor="middle" class="label">Write CLI error to stderr</text>
<text x="490" y="498" text-anchor="middle" class="detail">Invalid options / scan root</text>
<path d="M490 520 V565" class="flow"/>
<rect x="390" y="567" width="200" height="60" rx="16" class="data"/>
<text x="490" y="603" text-anchor="middle" class="label">Exit code 2</text>

<!-- valid path -->
<path d="M900 360 H1110 V440" class="flow"/>
<text x="950" y="344" class="edge">Yes</text>
<rect x="930" y="442" width="360" height="82" rx="20" class="action"/>
<text x="1110" y="474" text-anchor="middle" class="label">Build active rule set</text>
<text x="1110" y="500" text-anchor="middle" class="detail">RuleCatalog + exclusions + optional ATT&amp;CK</text>
<path d="M1110 524 V568" class="flow"/>
<rect x="930" y="570" width="360" height="82" rx="20" class="action"/>
<text x="1110" y="602" text-anchor="middle" class="label">Traverse scan directory</text>
<text x="1110" y="628" text-anchor="middle" class="detail">Recursively enumerate candidate files</text>
<path d="M1110 652 V690" class="flow"/>

<!-- file available decision -->
<polygon points="1110,690 1220,755 1110,820 1000,755" class="decision"/>
<text x="1110" y="750" text-anchor="middle" class="label">Next PHP file</text>
<text x="1110" y="773" text-anchor="middle" class="label">available?</text>

<!-- no branch finalize -->
<path d="M1220 755 H1430 V950" class="flow"/>
<text x="1300" y="738" class="edge">No — finish scan</text>

<!-- yes branch filter -->
<path d="M1000 755 H830 V850" class="flow"/>
<text x="900" y="738" class="edge">Yes</text>
<rect x="660" y="852" width="340" height="78" rx="20" class="action"/>
<text x="830" y="883" text-anchor="middle" class="label">Apply path exclusions</text>
<text x="830" y="908" text-anchor="middle" class="detail">Skip excluded paths / non-PHP files</text>
<path d="M830 930 V970" class="flow"/>
<polygon points="830,970 925,1025 830,1080 735,1025" class="decision"/>
<text x="830" y="1031" text-anchor="middle" class="label">Excluded?</text>
<!-- excluded loop -->
<path d="M735 1025 H600 V755 H1000" class="flow"/>
<text x="650" y="1008" class="edge">Yes — next file</text>
<!-- not excluded -->
<path d="M925 1025 H1080 V1105" class="flow"/>
<text x="965" y="1008" class="edge">No</text>

<!-- file read and warnings lane -->
<rect x="930" y="1107" width="300" height="80" rx="20" class="action"/>
<text x="1080" y="1138" text-anchor="middle" class="label">Read PHP file</text>
<text x="1080" y="1164" text-anchor="middle" class="detail">Unreadable file → record warning</text>

<!-- analysis lane as side panel to right -->
<rect x="1310" y="300" width="240" height="500" rx="16" fill="#f7fafc" stroke="#a8b8c8" stroke-width="1.8"/>
<text x="1430" y="335" text-anchor="middle" class="label">Analysis branches</text>
<rect x="1335" y="370" width="190" height="90" rx="18" class="action"/>
<text x="1430" y="405" text-anchor="middle" class="label">Regex rules</text>
<text x="1430" y="431" text-anchor="middle" class="detail">Pattern matching</text>
<rect x="1335" y="500" width="190" height="100" rx="18" class="action"/>
<text x="1430" y="535" text-anchor="middle" class="label">CallInspector</text>
<text x="1430" y="561" text-anchor="middle" class="detail">PHP tokenization</text>
<text x="1430" y="582" text-anchor="middle" class="detail">Literal call arguments</text>
<rect x="1370" y="650" width="120" height="14" rx="4" class="bar"/>
<text x="1430" y="690" text-anchor="middle" class="detail">Merge findings</text>
<text x="1430" y="716" text-anchor="middle" class="detail">severity · rule · line</text>
<text x="1430" y="750" text-anchor="middle" class="edge">For readable, non-empty files</text>

<!-- read to branches -->
<path d="M1230 1145 H1270 V415 H1335" class="flow"/>
<path d="M1270 550 H1335" class="flow"/>
<path d="M1430 460 V495" class="flow"/>
<path d="M1430 600 V650" class="flow"/>
<!-- merge to results -->
<path d="M1490 657 H1555 V880 H1430 V950" class="flow"/>

<!-- results and report -->
<rect x="1270" y="952" width="300" height="82" rx="20" class="action"/>
<text x="1420" y="984" text-anchor="middle" class="label">Finalize scan results</text>
<text x="1420" y="1010" text-anchor="middle" class="detail">Counts · findings · warnings</text>
<path d="M1420 1034 V1065" class="flow"/>
<rect x="1270" y="1067" width="300" height="80" rx="20" class="action"/>
<text x="1420" y="1098" text-anchor="middle" class="label">Render report</text>
<text x="1420" y="1124" text-anchor="middle" class="detail">Text or SARIF 2.1.0</text>
<path d="M1420 1147 V1172" class="flow"/>
<rect x="1270" y="1174" width="300" height="48" rx="12" class="data"/>
<text x="1420" y="1204" text-anchor="middle" class="label">Output + determine exit code</text>

<!-- footer note -->
<rect x="48" y="1140" width="800" height="82" rx="12" fill="#eef7f2" stroke="#78a994" stroke-width="1.7"/>
<text x="72" y="1173" class="label">Data handling guarantee</text>
<text x="72" y="1200" class="detail">Source files are read as text and PHP tokens. No application code is executed.</text>
</svg>