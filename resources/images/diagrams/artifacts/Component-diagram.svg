<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<defs>
 <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24476b" stroke-width="1.7"/></marker>
 <style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#172b45}.h{font-size:31px;font-weight:700}.sub{font-size:17px;fill:#52677e}.st{font-size:21px;font-weight:700}.tag{font-size:15px;font-style:italic;fill:#31577e}.d{font-size:16px;fill:#40566e}
 .container{fill:#f7fbff;stroke:#244c78;stroke-width:2.5}.comp{fill:#eaf3ff;stroke:#31577e;stroke-width:2.2}.pkg{fill:#effaf4;stroke:#5b9279;stroke-width:2.2}.rule{fill:#f3fbf7;stroke:#5b9279;stroke-width:2}.artifact{fill:#fff7df;stroke:#927a37;stroke-width:2}.exception{fill:#fff0f2;stroke:#a64e5b;stroke-width:2}
 .dep{fill:none;stroke:#24476b;stroke-width:2.4;stroke-dasharray:9 7;marker-end:url(#a)}.ctrl{fill:none;stroke:#24476b;stroke-width:2.6;marker-end:url(#a)}.err{fill:none;stroke:#b43c4c;stroke-width:2.3;stroke-dasharray:8 6;marker-end:url(#a)}
 </style>
</defs>
<rect x="12" y="12" width="1576" height="1076" rx="18" fill="#fff" stroke="#203d5d" stroke-width="2"/>
<text x="48" y="58" class="h">C4 — C3: Component View · PHP Security Linter</text>
<text x="48" y="88" class="sub">UML component diagram · current main-branch implementation · PHP 8.0+</text>

<!-- actor -->
<circle cx="110" cy="280" r="22" fill="none" stroke="#263f5c" stroke-width="3"/>
<path d="M110 302 V370 M74 326 H146 M110 370 L80 412 M110 370 L140 412" fill="none" stroke="#263f5c" stroke-width="3"/>
<text x="110" y="450" text-anchor="middle" class="tag">«actor»</text><text x="110" y="478" text-anchor="middle" class="st">Developer /</text><text x="110" y="504" text-anchor="middle" class="st">Security Engineer</text>

<!-- container boundary -->
<rect x="220" y="130" width="1340" height="820" rx="22" class="container"/>
<text x="250" y="168" class="tag">«container»</text><text x="250" y="198" class="st">PHP Security Linter CLI · bin/php-sl</text><text x="250" y="224" class="d">Command-line entry point and static-analysis runtime</text>

<!-- CLI -->
<rect x="270" y="285" width="300" height="190" rx="14" class="comp"/>
<text x="420" y="318" text-anchor="middle" class="tag">«component»</text><text x="420" y="350" text-anchor="middle" class="st">CLI Application</text><text x="420" y="375" text-anchor="middle" class="d">bin/php-sl</text>
<text x="295" y="414" class="d">• Parse options and validate path</text><text x="295" y="440" class="d">• Configure Linter and exclusions</text><text x="295" y="466" class="d">• Render text / SARIF; set exit code</text>

<!-- Linter -->
<rect x="680" y="285" width="390" height="220" rx="14" class="comp"/>
<text x="875" y="318" text-anchor="middle" class="tag">«component»</text><text x="875" y="350" text-anchor="middle" class="st">Linter</text><text x="875" y="376" text-anchor="middle" class="d">Yousha\PhpSecurityLinter\Linter</text>
<text x="710" y="416" class="d">• Validate scan root</text><text x="710" y="442" class="d">• Traverse directories; filter PHP files</text><text x="710" y="468" class="d">• Apply regex rules; collect findings</text><text x="710" y="494" class="d">• Return findings and _meta warnings</text>

<!-- CallInspector -->
<rect x="1190" y="275" width="310" height="145" rx="14" class="comp"/>
<text x="1345" y="308" text-anchor="middle" class="tag">«component»</text><text x="1345" y="340" text-anchor="middle" class="st">CallInspector</text><text x="1345" y="366" text-anchor="middle" class="d">Rules\CallInspector</text><text x="1215" y="397" class="d">PHP tokens · direct calls · literals</text>

<!-- RuleCatalog -->
<rect x="1190" y="485" width="310" height="130" rx="14" class="comp"/>
<text x="1345" y="518" text-anchor="middle" class="tag">«component»</text><text x="1345" y="550" text-anchor="middle" class="st">RuleCatalog</text><text x="1345" y="576" text-anchor="middle" class="d">Rules\RuleCatalog</text><text x="1345" y="600" text-anchor="middle" class="d">Aggregates and selects providers</text>

<!-- Rules package -->
<rect x="900" y="675" width="600" height="220" rx="16" class="pkg"/>
<path d="M900 675 h185 l28 28 h-213 z" fill="#dff3e8" stroke="#5b9279" stroke-width="2"/>
<text x="920" y="697" class="st" style="font-size:18px">«package» Rules</text>
<rect x="930" y="745" width="165" height="115" rx="12" class="rule"/>
<text x="1012" y="778" text-anchor="middle" class="tag">«component»</text><text x="1012" y="808" text-anchor="middle" class="st">CisRules</text><text x="1012" y="835" text-anchor="middle" class="d">16 rules</text>
<rect x="1115" y="745" width="165" height="115" rx="12" class="rule"/>
<text x="1197" y="778" text-anchor="middle" class="tag">«component»</text><text x="1197" y="808" text-anchor="middle" class="st">OwaspRules</text><text x="1197" y="835" text-anchor="middle" class="d">29 rules</text>
<rect x="1300" y="745" width="170" height="115" rx="12" class="rule"/>
<text x="1385" y="778" text-anchor="middle" class="tag">«component»</text><text x="1385" y="808" text-anchor="middle" class="st">AttackRules</text><text x="1385" y="835" text-anchor="middle" class="d">3 · opt-in</text>

<!-- reporting -->
<rect x="680" y="650" width="390" height="160" rx="14" class="comp"/>
<text x="875" y="683" text-anchor="middle" class="tag">«component»</text><text x="875" y="715" text-anchor="middle" class="st">SarifFormatter</text><text x="875" y="741" text-anchor="middle" class="d">Reporting\SarifFormatter</text><text x="710" y="775" class="d">Serialize findings as SARIF 2.1.0</text><text x="710" y="799" class="d">Build rule descriptors from RuleCatalog</text>

<!-- Exception -->
<rect x="270" y="650" width="300" height="110" rx="14" class="exception"/>
<text x="420" y="683" text-anchor="middle" class="tag">«exception»</text><text x="420" y="715" text-anchor="middle" class="st">LinterException</text><text x="420" y="741" text-anchor="middle" class="d">Invalid scan path / scan errors</text>

<!-- output artifacts -->
<path d="M270 820 h220 l28 28 v75 h-248 z M490 820 v28 h28" class="artifact"/>
<text x="394" y="862" text-anchor="middle" class="tag">«artifact»</text><text x="394" y="892" text-anchor="middle" class="st">Text report</text><text x="394" y="918" text-anchor="middle" class="d">stdout</text>
<path d="M600 820 h235 l28 28 v75 h-263 z M835 820 v28 h28" class="artifact"/>
<text x="731" y="862" text-anchor="middle" class="tag">«artifact»</text><text x="731" y="892" text-anchor="middle" class="st">SARIF 2.1.0 report</text><text x="731" y="918" text-anchor="middle" class="d">stdout or file</text>

<!-- relationships -->
<path d="M146 340 H270" class="ctrl"/><text x="207" y="315" text-anchor="middle" class="tag">invokes</text>
<path d="M570 380 H680" class="ctrl"/><text x="625" y="360" text-anchor="middle" class="tag">configures / calls</text>
<path d="M1070 340 H1190" class="dep"/><text x="1130" y="320" text-anchor="middle" class="tag">uses</text>
<path d="M1070 455 H1130 V550 H1190" class="dep"/><text x="1125" y="480" class="tag">uses</text>
<path d="M1345 615 V675" class="ctrl"/>
<path d="M1012 745 V715 H1345 V675" class="dep"/>
<path d="M1197 745 V715" class="dep"/><path d="M1385 745 V715" class="dep"/>
<path d="M875 505 V650" class="dep"/><text x="895" y="590" class="tag">formats results</text>
<path d="M680 730 H570" class="err"/><text x="625" y="710" text-anchor="middle" class="tag">throws</text>
<path d="M420 475 V820" class="ctrl"/>
<path d="M875 810 V820" class="ctrl"/>
<path d="M570 440 H625 V565 H875 V650" class="dep"/>
<text x="610" y="545" class="tag">--format=sarif</text>

<!-- notes and legend -->
<rect x="250" y="975" width="1280" height="78" rx="12" fill="#f4f7fa" stroke="#c3ced9" stroke-width="1.5"/>
<text x="275" y="1007" class="st" style="font-size:18px">Implementation notes</text>
<text x="275" y="1035" class="d">Regex matching is performed by Linter; CallInspector handles token-based direct-call checks. MITRE ATT&amp;CK rules are disabled unless --include-attack is supplied.</text>
<text x="250" y="1075" class="d">Legend:  «component» module     «package» namespace     dashed arrow = dependency     solid arrow = invocation / data flow     red arrow = exception path</text>
</svg>