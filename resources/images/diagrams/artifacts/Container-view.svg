<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#183b63" stroke-width="1.8"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172b45}
    .title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#52657c}
    .st{font-size:20px;font-weight:700}.meta{font-size:15px;fill:#52657c}
    .tag{font-size:14px;font-style:italic;fill:#31577e}
    .box{fill:#edf5ff;stroke:#244c78;stroke-width:2.4}
    .artifact{fill:#fff7dd;stroke:#856b26;stroke-width:2.2}
    .external{fill:#f5f7fa;stroke:#586b80;stroke-width:2.2}
    .line{stroke:#183b63;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    .dash{stroke-dasharray:9 7}
  </style>
</defs>
<rect x="12" y="12" width="1376" height="836" rx="18" fill="#fff" stroke="#203d5d" stroke-width="2"/>
<text x="48" y="58" class="title">C4 — C2: Container View</text>
<text x="48" y="88" class="subtitle">PHP Security Linter · UML component and artifact notation</text>
<rect x="350" y="130" width="720" height="590" rx="20" fill="#f8fbff" stroke="#31577e" stroke-width="2.4"/>
<text x="380" y="170" class="tag">«executionEnvironment»</text>
<text x="380" y="198" class="st">PHP CLI Runtime</text>
<text x="380" y="224" class="meta">PHP 8.0+ · PCRE · tokenizer · local process</text>
<rect x="425" y="285" width="570" height="250" rx="14" class="box"/>
<path d="M965 302 h22 v24 h-22 M965 314 h-14 v12 h14 M965 302 h-14 v12 h14" fill="none" stroke="#244c78" stroke-width="2"/>
<text x="710" y="338" text-anchor="middle" class="tag">«container»</text>
<text x="710" y="380" text-anchor="middle" class="st" style="font-size:27px">PHP Security Linter CLI</text>
<text x="710" y="414" text-anchor="middle" class="meta">bin/php-sl · command-line SAST application</text>
<line x1="485" y1="445" x2="935" y2="445" stroke="#9db3ca" stroke-width="1.5"/>
<text x="710" y="480" text-anchor="middle" class="meta">Traverses PHP files · applies configured security rules</text>
<text x="710" y="506" text-anchor="middle" class="meta">Analyzes source as data; does not execute scanned code</text>
<!-- actor -->
<circle cx="125" cy="345" r="22" fill="none" stroke="#263f5c" stroke-width="3"/>
<path d="M125 368 V435 M88 392 H162 M125 435 L92 480 M125 435 L158 480" fill="none" stroke="#263f5c" stroke-width="3"/>
<text x="125" y="520" text-anchor="middle" class="tag">«actor»</text>
<text x="125" y="548" text-anchor="middle" class="st">Developer /</text><text x="125" y="574" text-anchor="middle" class="st">Security Engineer</text>
<!-- source artifact -->
<path d="M1165 230 H1320 L1350 260 V390 H1165 Z M1320 230 V260 H1350" class="artifact" stroke-linejoin="round"/>
<text x="1255" y="292" text-anchor="middle" class="tag">«artifact»</text>
<text x="1255" y="326" text-anchor="middle" class="st">PHP source</text>
<text x="1255" y="352" text-anchor="middle" class="meta">Codebase (.php files)</text>
<!-- reports -->
<path d="M1165 510 H1320 L1350 540 V700 H1165 Z M1320 510 V540 H1350" class="artifact" stroke-linejoin="round"/>
<text x="1255" y="575" text-anchor="middle" class="tag">«artifact»</text>
<text x="1255" y="612" text-anchor="middle" class="st">Scan report</text>
<text x="1255" y="642" text-anchor="middle" class="meta">Text / SARIF 2.1.0</text>
<!-- relations -->
<path d="M165 390 H420" class="line"/>
<text x="292" y="365" text-anchor="middle" class="tag">invokes CLI</text>
<path d="M1160 310 H1090 V390 H1000" class="line"/>
<text x="1090" y="286" text-anchor="middle" class="tag">reads source</text>
<path d="M1000 470 H1090 V605 H1160" class="line"/>
<text x="1085" y="500" text-anchor="middle" class="tag">writes report</text>
<!-- CI runner external -->
<rect x="65" y="665" width="290" height="105" rx="12" class="external"/>
<text x="210" y="697" text-anchor="middle" class="tag">«external system»</text>
<text x="210" y="729" text-anchor="middle" class="st">CI/CD runner</text>
<text x="210" y="752" text-anchor="middle" class="meta">Optional automation client</text>
<path d="M355 710 H390 V535 H425" class="line dash"/>
<text x="405" y="690" text-anchor="middle" class="tag">runs CLI</text>
<!-- legend -->
<rect x="390" y="765" width="680" height="54" rx="10" fill="#f4f7fa" stroke="#c3ced9"/>
<text x="415" y="798" class="meta">Legend:</text>
<rect x="490" y="780" width="32" height="22" class="box"/><text x="532" y="798" class="meta">Container</text>
<path d="M650 780 h32 l10 10 v12 h-42 z" class="artifact"/><text x="700" y="798" class="meta">Artifact</text>
<path d="M820 791 h52" class="line"/><text x="882" y="798" class="meta">Interaction / data flow</text>
</svg>